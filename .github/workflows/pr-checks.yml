name: Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-pr-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-pr-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Check code formatting with black
        run: black --check tools/scripts/ sources/ tests/

      - name: Run ruff linting
        run: ruff check tools/scripts/ sources/ tests/

      - name: Run mypy type checking
        run: |
          export PYTHONPATH=$PWD
          mypy tools/scripts/ sources/ tests/ --ignore-missing-imports

      # Keep the PR checkout unchanged. Validation must inspect original product data.
      - name: Run validations
        run: python tools/scripts/validate/run_validations.py

      - name: Run tests with coverage
        run: |
          export PYTHONPATH=$PWD
          pytest --cov=tools/scripts --cov=sources --cov-report=xml --cov-report=term

      - name: Verify validations did not change tracked data
        run: git diff --exit-code -- data/

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

